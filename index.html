/* ============================================================================
   PARSING HELPERS
============================================================================ */
function cell(row, idx) { const v = row[idx]; return v === undefined || v === null ? "" : String(v).trim(); }
function parseNumberVal(raw) {
  const s = String(raw ?? "").trim();
  if (s === "") return null;
  const cleaned = s.replace(/[, ]/g, "").replace(/RM/gi, "");
  if (cleaned === "" || /^n\/?a$/i.test(cleaned)) return null;
  const n = parseFloat(cleaned);
  return isNaN(n) ? null : n;
}
function excelSerialToDate(n) { return new Date(Math.round((n - 25569) * 86400 * 1000)); }
function parseDateVal(raw) {
  const s = String(raw ?? "").trim();
  if (s === "" || /^n\/?a$/i.test(s)) return { date: null, empty: true, invalid: false };
  if (/^\d+(\.\d+)?$/.test(s) && Number(s) > 20000 && Number(s) < 60000) {
    const d = excelSerialToDate(Number(s));
    if (!isNaN(d.getTime())) return { date: d, empty: false, invalid: false };
  }
  let d = new Date(s);
  if (!isNaN(d.getTime())) return { date: d, empty: false, invalid: false };
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let [, dd, mm, yy] = m;
    yy = yy.length === 2 ? "20" + yy : yy;
    d = new Date(`${yy}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`);
    if (!isNaN(d.getTime())) return { date: d, empty: false, invalid: false };
  }
  return { date: null, empty: false, invalid: true };
}
function percentileRank(sortedAsc, value) {
  if (!sortedAsc.length) return 0;
  let count = 0;
  for (const v of sortedAsc) if (v <= value) count++;
  return (count / sortedAsc.length) * 100;
}

/* ============================================================================
   CORE DATA PROCESSING
============================================================================ */
function extractRawRecords(rows) {
  const records = [];
  for (let i = DATA_START_ROW_INDEX; i < rows.length; i++) {
    const row = rows[i] || [];
    const email = cell(row, COL.EMAIL), status = cell(row, COL.STATUS), agentName = cell(row, COL.AGENT),
      phoneNumber = cell(row, COL.PHONE), schoolName = cell(row, COL.SCHOOL), salesRaw = cell(row, COL.SALES),
      group = cell(row, COL.GROUP), creditRaw = cell(row, COL.CREDIT), reloadDateRaw = cell(row, COL.RELOAD_DATE),
      reloadAmtRaw = cell(row, COL.RELOAD_AMT);
    const stateOfficer = cell(row, COL.STATE_OFFICER);
    const isBlankRow = ![email, status, agentName, phoneNumber, schoolName, salesRaw, group, creditRaw, reloadDateRaw, reloadAmtRaw].some((v) => v !== "");
    if (isBlankRow) continue;
    const totalSales = parseNumberVal(salesRaw), creditBalance = parseNumberVal(creditRaw), lastReloadAmount = parseNumberVal(reloadAmtRaw);
    const dateInfo = parseDateVal(reloadDateRaw);
    records.push({
      rowIndex: i + 1, key: `${email || ""}|${phoneNumber || ""}|${agentName || ""}|${i}`,
      schoolName, agentName, phoneNumber, status, email, group, stateOfficer,
      totalSales, creditBalance, lastReloadAmount,
      lastReloadDate: dateInfo.date, reloadDateEmpty: dateInfo.empty, reloadDateInvalid: dateInfo.invalid,
      _raw: { salesRaw, creditRaw, reloadAmtRaw, reloadDateRaw },
    });
  }
  return records;
}
function computeDataQuality(records) {
  const emailCount = {}, phoneCount = {};
  records.forEach((r) => {
    if (r.email) emailCount[r.email.toLowerCase()] = (emailCount[r.email.toLowerCase()] || 0) + 1;
    if (r.phoneNumber) phoneCount[r.phoneNumber] = (phoneCount[r.phoneNumber] || 0) + 1;
  });
  const details = {
    missingSchool: [], missingAgent: [], missingPhone: [], missingEmail: [],
    missingStatus: [], missingGroup: [], missingStateOfficer: [],
    invalidSales: [], invalidCredit: [], invalidAmount: [], invalidReloadDate: [],
    noSales: [], zeroCredit: [], duplicateEmailRecords: [], duplicatePhoneRecords: [],
    incompleteRecords: [], validRecords: [], missingReloadDate: [],
  };
  records.forEach((r) => {
    let bad = false;
    if (!r.schoolName) { details.missingSchool.push(r); bad = true; }
    if (!r.agentName) { details.missingAgent.push(r); bad = true; }
    if (!r.phoneNumber) { details.missingPhone.push(r); bad = true; }
    if (!r.email) { details.missingEmail.push(r); bad = true; }
    if (!r.status) { details.missingStatus.push(r); bad = true; }
    if (!r.group) { details.missingGroup.push(r); bad = true; }
    if (!r.stateOfficer) { details.missingStateOfficer.push(r); }
    if (r._raw.salesRaw !== "" && r.totalSales === null) { details.invalidSales.push(r); bad = true; }
    if (r._raw.creditRaw !== "" && r.creditBalance === null) { details.invalidCredit.push(r); bad = true; }
    if (r._raw.reloadAmtRaw !== "" && r.lastReloadAmount === null) { details.invalidAmount.push(r); bad = true; }
    if (r.reloadDateInvalid) { details.invalidReloadDate.push(r); bad = true; }
    if (r.reloadDateEmpty) details.missingReloadDate.push(r);
    if (r.totalSales === 0) details.noSales.push(r);
    if (r.creditBalance === 0) details.zeroCredit.push(r);
    if (r.email && emailCount[r.email.toLowerCase()] > 1) details.duplicateEmailRecords.push(r);
    if (r.phoneNumber && phoneCount[r.phoneNumber] > 1) details.duplicatePhoneRecords.push(r);
    if (bad) details.incompleteRecords.push(r); else details.validRecords.push(r);
  });
  const summary = {
    totalRecords: records.length,
    validRecords: details.validRecords.length,
    incompleteRecords: details.incompleteRecords.length,
    duplicateEmailRecords: details.duplicateEmailRecords.length,
    duplicatePhoneRecords: details.duplicatePhoneRecords.length,
    missingReloadDate: details.missingReloadDate.length,
    invalidReloadDate: details.invalidReloadDate.length,
    noSales: details.noSales.length,
    zeroCredit: details.zeroCredit.length,
    missingSchool: details.missingSchool.length,
    missingAgent: details.missingAgent.length,
    missingPhone: details.missingPhone.length,
    missingEmail: details.missingEmail.length,
    missingStatus: details.missingStatus.length,
    missingGroup: details.missingGroup.length,
    missingStateOfficer: details.missingStateOfficer.length,
    invalidSales: details.invalidSales.length,
    invalidAmount: details.invalidAmount.length,
    invalidCredit: details.invalidCredit.length,
  };
  return { summary, details, all: records };
}
function computeAgents(records, settings) {
  const today = new Date();
  const positiveSales = records.filter((r) => r.totalSales !== null && r.totalSales > 0).map((r) => r.totalSales).sort((a, b) => a - b);
  const validCredits = records.filter((r) => r.creditBalance !== null).map((r) => r.creditBalance).sort((a, b) => a - b);
  const validReloadAmts = records.filter((r) => r.lastReloadAmount !== null).map((r) => r.lastReloadAmount).sort((a, b) => a - b);
  const validDays = records.filter((r) => r.lastReloadDate).map((r) => Math.floor((today - r.lastReloadDate) / 86400000)).sort((a, b) => a - b);
  const { activeDays, lowDays, atRiskDays, weights } = settings;
  const wSum = weights.sales + weights.recency + weights.credit + weights.status + weights.reloadAmt + weights.risk || 1;

  return records.map((r) => {
    const daysSinceLastReload = r.lastReloadDate ? Math.floor((today - r.lastReloadDate) / 86400000) : null;
    let salesLevel = "UNKNOWN";
    if (r.totalSales === 0) salesLevel = "ZERO";
    else if (r.totalSales !== null) {
      const p = percentileRank(positiveSales, r.totalSales);
      salesLevel = p >= 90 ? "TOP_PERFORMER" : p >= 70 ? "HIGH_VALUE" : p >= 30 ? "MEDIUM_VALUE" : "LOW_VALUE";
    }
    let creditLevel = "UNKNOWN", creditPercentile = null;
    if (r.creditBalance !== null) {
      creditPercentile = percentileRank(validCredits, r.creditBalance);
      creditLevel = creditPercentile <= 25 ? "LOW" : creditPercentile <= 50 ? "MEDIUM" : creditPercentile <= 75 ? "HEALTHY" : "HIGH";
    }
    let reloadRecencyStatus, activityStatus;
    if (r.reloadDateInvalid) { reloadRecencyStatus = "DATA_REVIEW"; activityStatus = "DATA_REVIEW"; }
    else if (r.reloadDateEmpty || daysSinceLastReload === null) { reloadRecencyStatus = "NO_VALID_RELOAD_DATE"; activityStatus = "NO_RELOAD_RECORD"; }
    else if (daysSinceLastReload <= activeDays) { reloadRecencyStatus = "RECENT"; activityStatus = "ACTIVE"; }
    else if (daysSinceLastReload <= lowDays) { reloadRecencyStatus = "MODERATE"; activityStatus = "LOW_ACTIVITY"; }
    else if (daysSinceLastReload <= atRiskDays) { reloadRecencyStatus = "AGING"; activityStatus = "AT_RISK"; }
    else { reloadRecencyStatus = "STALE"; activityStatus = "INACTIVE"; }

    const isApproved = /approved/i.test(r.status || "");
    const salesScore = r.totalSales && r.totalSales > 0 ? percentileRank(positiveSales, r.totalSales) : 0;
    let recencyScore = 0;
    if (daysSinceLastReload !== null) recencyScore = percentileRank(validDays, daysSinceLastReload);
    else if (r.totalSales && r.totalSales > 0) recencyScore = 65;
    const creditOppScore = creditPercentile !== null ? Math.max(0, 100 - creditPercentile) : 0;
    const statusScore = isApproved ? 100 : 40;
    const reloadAmtScore = r.lastReloadAmount !== null ? percentileRank(validReloadAmts, r.lastReloadAmount) : 0;
    let riskScore = 0;
    if (r.totalSales === 0) riskScore = r.reloadDateEmpty ? 80 : (r.creditBalance > 0 ? 60 : 40);
    else if (activityStatus === "INACTIVE") riskScore = 70;
    else if (activityStatus === "AT_RISK") riskScore = 45;

    const priorityScore = Math.round((salesScore * weights.sales + recencyScore * weights.recency + creditOppScore * weights.credit + statusScore * weights.status + reloadAmtScore * weights.reloadAmt + riskScore * weights.risk) / wSum);
    const priorityLevel = priorityScore >= 80 ? "CRITICAL" : priorityScore >= 60 ? "HIGH" : priorityScore >= 40 ? "MEDIUM" : "LOW";

    const highSales = salesLevel === "TOP_PERFORMER" || salesLevel === "HIGH_VALUE";
    let category = null; const reasons = [];
    if (isApproved && highSales && creditLevel === "LOW" && daysSinceLastReload !== null && daysSinceLastReload > lowDays) {
      category = "URGENT_RELOAD"; reasons.push("Agent approved", "Total sales dalam kategori tinggi", "Baki kredit rendah", `${daysSinceLastReload} hari sejak reload terakhir`);
    } else if (highSales && (activityStatus === "AT_RISK" || activityStatus === "INACTIVE")) {
      category = "HIGH_VALUE_AT_RISK"; reasons.push("Total sales tinggi", `Status aktiviti: ${ACTIVITY_META[activityStatus].label}`, daysSinceLastReload !== null ? `${daysSinceLastReload} hari sejak reload terakhir` : "Tiada rekod reload sah");
    } else if (creditLevel === "LOW" && r.totalSales > 0) {
      category = "LOW_CREDIT_FOLLOWUP"; reasons.push("Baki kredit rendah", "Agent masih mempunyai jualan");
    } else if (activityStatus === "INACTIVE") {
      category = "INACTIVE"; reasons.push(`Tiada reload untuk ${daysSinceLastReload} hari`);
    } else if (activityStatus === "LOW_ACTIVITY" || activityStatus === "AT_RISK") {
      category = "LOW_ACTIVITY"; reasons.push("Sales rendah / reload tidak konsisten", daysSinceLastReload !== null ? `${daysSinceLastReload} hari sejak reload terakhir` : "");
    } else if (salesLevel === "ZERO") {
      category = "ZERO_SALES";
      if (r.reloadDateEmpty) reasons.push("Tiada rekod reload", "Total sales = 0");
      else if (r.creditBalance > 0) reasons.push("Mempunyai baki kredit tetapi tiada jualan");
      else reasons.push("Total sales = 0");
    } else if (isApproved && activityStatus === "ACTIVE" && (salesLevel === "HIGH_VALUE" || salesLevel === "MEDIUM_VALUE") && (creditLevel === "HEALTHY" || creditLevel === "HIGH")) {
      category = "HIGH_POTENTIAL"; reasons.push("Agent approved & aktif", "Sales baik", "Baki kredit sihat untuk peningkatan reload");
    }

    let action = "NONE";
    if (category === "URGENT_RELOAD") action = "RELOAD";
    else if (category === "HIGH_VALUE_AT_RISK") action = "CALL";
    else if (category === "LOW_CREDIT_FOLLOWUP") action = "WHATSAPP";
    else if (category === "INACTIVE") action = "REACTIVATE";
    else if (category === "LOW_ACTIVITY") action = "WHATSAPP";
    else if (category === "ZERO_SALES") action = r.reloadDateEmpty ? "TRAINING" : "INVESTIGATE";
    else if (category === "HIGH_POTENTIAL") action = "UPSELL";
    else if (!r.schoolName || !r.agentName || !r.phoneNumber) action = "UPDATE_INFO";

    return { ...r, daysSinceLastReload, reloadRecencyStatus, activityStatus, salesLevel, creditLevel, creditPercentile, isApproved, priorityScore, priorityLevel, recommendedAction: action, actionReason: reasons.filter(Boolean).join(" • "), category };
  });
}
function computeGroupStats(agents) {
  const groups = {};
  agents.forEach((a) => {
    const g = a.group || "(No Group)";
    if (!groups[g]) groups[g] = { name: g, total: 0, approved: 0, totalSales: 0, salesCount: 0, totalCredit: 0, creditCount: 0, active: 0, atRisk: 0, inactive: 0, zeroSales: 0, highPriority: 0 };
    const gr = groups[g];
    gr.total++;
    if (a.isApproved) gr.approved++;
    if (a.totalSales !== null) { gr.totalSales += a.totalSales; gr.salesCount++; }
    if (a.creditBalance !== null) { gr.totalCredit += a.creditBalance; gr.creditCount++; }
    if (a.activityStatus === "ACTIVE") gr.active++;
    if (a.activityStatus === "AT_RISK") gr.atRisk++;
    if (a.activityStatus === "INACTIVE") gr.inactive++;
    if (a.salesLevel === "ZERO") gr.zeroSales++;
    if (a.priorityLevel === "CRITICAL" || a.priorityLevel === "HIGH") gr.highPriority++;
  });
  return Object.values(groups).map((g) => ({ ...g, avgSales: g.salesCount ? g.totalSales / g.salesCount : 0, avgCredit: g.creditCount ? g.totalCredit / g.creditCount : 0 })).sort((a, b) => b.totalSales - a.totalSales);
}

function buildExportSheetRows(agents, followUps, officerEnabled) {
  const header = [
    "School Name", "Agent Name", "Phone Number", "Email", "Status", "Group",
    ...(officerEnabled ? ["State Officer"] : []),
    "Total Sales 24-26", "Credit Balance", "Last Reload Date", "Last Reload Amount",
    "Days Since Last Reload", "Activity Status", "Sales Level", "Credit Level",
    "Priority Score", "Priority Level", "Recommended Action", "Action Reason",
    "Follow-Up Status", "Follow-Up Notes", "Follow-Up Date", "Next Action Date",
  ];
  const rows = agents.map((a) => {
    const fu = followUps[a.key] || {};
    return [
      a.schoolName, a.agentName, a.phoneNumber, a.email, a.status, a.group,
      ...(officerEnabled ? [a.stateOfficer || ""] : []),
      a.totalSales ?? "", a.creditBalance ?? "",
      a.lastReloadDate ? a.lastReloadDate.toLocaleDateString("en-MY") : (a.reloadDateInvalid ? "INVALID" : ""),
      a.lastReloadAmount ?? "", a.daysSinceLastReload ?? "",
      ACTIVITY_META[a.activityStatus].label, SALES_META[a.salesLevel].label, CREDIT_META[a.creditLevel].label,
      a.priorityScore, PRIORITY_META[a.priorityLevel].label, ACTION_META[a.recommendedAction].label, a.actionReason,
      fu.status || "", fu.notes || "", fu.followUpDate || "", fu.nextActionDate || "",
    ];
  });
  return [header, ...rows];
}
function exportWorkbook(agents, followUps, officerEnabled) {
  const aoa = buildExportSheetRows(agents, followUps, officerEnabled);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "TOPUP APPS AGENT - UPDATED");
  return wb;
}
function downloadExcel(agents, followUps, officerEnabled) {
  const wb = exportWorkbook(agents, followUps, officerEnabled);
  const stamp = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `topup-agent-updated-${stamp}.xlsx`);
}
function workbookToBlob(wb) {
  const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  return new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
async function uploadToGoogleDrive(agents, followUps, officerEnabled, accessToken) {
  const wb = exportWorkbook(agents, followUps, officerEnabled);
  const blob = workbookToBlob(wb);
  const stamp = new Date().toISOString().slice(0, 10);
  const fileName = `topup-agent-updated-${stamp}.xlsx`;
  const metadata = { name: fileName, mimeType: blob.type };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", blob);
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink", {
    method: "POST",
    headers: { Authorization: `Bearer ${accessToken}` },
    body: form,
  });
  if (!res.ok) throw new Error(`Google Drive upload gagal (${res.status})`);
  return res.json();
}

function applyFilters(agents, filters, search) {
  return agents.filter((a) => {

    if (filters.activityStatus && a.activityStatus !== filters.activityStatus) return false;
    if (filters.salesLevel && a.salesLevel !== filters.salesLevel) return false;
    if (filters.priorityLevel && a.priorityLevel !== filters.priorityLevel) return false;
    if (filters.creditLevel && a.creditLevel !== filters.creditLevel) return false;
    if (filters.stateOfficer && a.stateOfficer !== filters.stateOfficer) return false;
    if (search) { const q = search.toLowerCase(); const hay = `${a.schoolName} ${a.agentName} ${a.phoneNumber} ${a.email} ${a.stateOfficer}`.toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });

function exportRecordsList(records, label, bookType) {
  const header = ["School Name", "Agent Name", "Phone Number", "Email", "Status", "Group", "State Officer", "Total Sales 24-26", "Credit Balance", "Last Reload Date (raw)", "Last Reload Amount"];
  const rows = records.map((r) => [
    r.schoolName, r.agentName, r.phoneNumber, r.email, r.status, r.group, r.stateOfficer,
    r.totalSales ?? "", r.creditBalance ?? "", r._raw.reloadDateRaw, r.lastReloadAmount ?? "",
  ]);
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, label.slice(0, 31));
  const ext = bookType === "biff8" ? "xls" : "xlsx";
  const stamp = new Date().toISOString().slice(0, 10);
  const safeName = label.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  XLSX.writeFile(wb, `data-quality-${safeName}-${stamp}.${ext}`, { bookType });
}

function useGoogleDrive() {
  const [clientId, setClientId] = useState("");
  const [apiKey, setApiKey] = useState("");
  const [token, setToken] = useState(null);
  const [status, setStatus] = useState("");
  const gisLoadingRef = useRef(false);
  const gapiLoadingRef = useRef(false);

  const ensureGis = useCallback(() => {
    return new Promise((resolve, reject) => {
      if (window.google?.accounts?.oauth2) return resolve();
      if (gisLoadingRef.current) {
        const check = setInterval(() => { if (window.google?.accounts?.oauth2) { clearInterval(check); resolve(); } }, 150);
        return;
      }
      gisLoadingRef.current = true;
      const script = document.createElement("script");
      script.src = "https://accounts.google.com/gsi/client";
      script.async = true;
      script.onload = () => resolve();
      script.onerror = () => reject(new Error("Gagal memuatkan Google Sign-In."));
      document.head.appendChild(script);
    });
  }, []);

  const ensurePicker = useCallback(() => {
    return new Promise((resolve, reject) => {
      const loadPicker = () => { window.gapi.load("picker", { callback: resolve }); };
      if (window.google?.picker) return resolve();
      if (window.gapi) return loadPicker();
      if (gapiLoadingRef.current) {
        const check = setInterval(() => { if (window.gapi) { clearInterval(check); loadPicker(); } }, 150);
        return;
      }
      gapiLoadingRef.current = true;
      const script = document.createElement("script");
      script.src = "https://apis.google.com/js/api.js";
      script.async = true;
      script.onload = loadPicker;
      script.onerror = () => reject(new Error("Gagal memuatkan Google Picker."));
      document.head.appendChild(script);
    });
  }, []);

  const signIn = useCallback(async () => {
    if (!clientId) return;
    setStatus("Menyambung ke Google...");
    try {
      await ensureGis();
      const tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/drive.file",
        callback: (resp) => {
          if (resp.access_token) { setToken(resp.access_token); setStatus("Berjaya sign in ke Google."); }
          else setStatus("Sign in gagal atau dibatalkan.");
        },
      });
      tokenClient.requestAccessToken();
    } catch (err) {
      setStatus(err.message || "Ralat menyambung ke Google.");
    }
  }, [clientId, ensureGis]);

  const pickFile = useCallback(async (onPicked) => {
    if (!token) { setStatus("Sila sign in ke Google dahulu."); return; }
    if (!apiKey) { setStatus("Sila masukkan Google API Key dahulu."); return; }
    try {
      await ensurePicker();
      const view = new window.google.picker.DocsView(window.google.picker.ViewId.DOCS)
        .setIncludeFolders(false)
        .setMimeTypes("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,application/vnd.google-apps.spreadsheet");
      const picker = new window.google.picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(token)
        .setDeveloperKey(apiKey)
        .setCallback((data) => {
          if (data.action === window.google.picker.Action.PICKED && data.docs?.[0]) {
            const doc = data.docs[0];
            onPicked({ id: doc.id, name: doc.name, mimeType: doc.mimeType });
          }
        })
        .build();
      picker.setVisible(true);
    } catch (err) {
      setStatus(err.message || "Gagal membuka Google Picker.");
    }
  }, [token, apiKey, ensurePicker]);

  // Native Google Sheets files (created via "New > Google Sheets", or auto-converted by
  // Drive's "Convert uploads" setting) are NOT binary xlsx — must use /export, not alt=media.
  const fetchFileArrayBuffer = useCallback(async (fileId, mimeType) => {
    const isNativeSheet = mimeType === "application/vnd.google-apps.spreadsheet";
    const url = isNativeSheet
      ? `https://www.googleapis.com/drive/v3/files/${fileId}/export?mimeType=${encodeURIComponent("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")}`
      : `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error(`Gagal memuat turun fail dari Drive (${res.status}). Sign in semula jika sesi telah tamat.`);
    return res.arrayBuffer();
  }, [token]);

  const fetchFileMeta = useCallback(async (fileId) => {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime,name,mimeType`, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error("Gagal semak status fail Drive.");
    return res.json();
  }, [token]);

  const upload = useCallback(async (agents, followUps, officerEnabled) => {
    if (!token) return;
    setStatus("Memuat naik ke Google Drive...");
    try {
      const res = await uploadToGoogleDrive(agents, followUps, officerEnabled, token);
      setStatus(`Berjaya dimuat naik: ${res.name}${res.webViewLink ? " — " + res.webViewLink : ""}`);
    } catch (err) {
      setStatus(err.message || "Muat naik ke Google Drive gagal.");
    }
  }, [token]);

  return { clientId, setClientId, apiKey, setApiKey, token, status, setStatus, signIn, upload, pickFile, fetchFileArrayBuffer, fetchFileMeta };
}

function parseWorkbookToRows(data) {
  const workbook = XLSX.read(data, { type: "array" });
  const targetName = workbook.SheetNames.find((n) => n.trim().toLowerCase() === SHEET_NAME.toLowerCase());
  if (!targetName) throw new Error(`Worksheet "${SHEET_NAME}" tidak dijumpai. Sila gunakan fail yang mengandungi worksheet tersebut.`);
  const ws = workbook.Sheets[targetName];
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" });
}

function App() {
  const [rawRows, setRawRows] = useState(null);
  const [fileName, setFileName] = useState("");
  const [importError, setImportError] = useState("");
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [page, setPage] = useState("dashboard");
  const [selectedAgent, setSelectedAgent] = useState(null);
  const [followUps, setFollowUps] = useState({});
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [filters, setFilters] = useState({});
  const [search, setSearch] = useState("");
  const [sortKey, setSortKey] = useState("priorityScore");
  const [sortDir, setSortDir] = useState("desc");
  const [driveFile, setDriveFile] = useState(null);
  const [driveModified, setDriveModified] = useState(null);
  const [driveUpdateAvailable, setDriveUpdateAvailable] = useState(false);
  const gDrive = useGoogleDrive();

  const handleFile = useCallback((file) => {
    setImportError(""); setFileName(file.name); setDriveFile(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const rows = parseWorkbookToRows(new Uint8Array(e.target.result));
        const test = extractRawRecords(rows);
        if (test.length === 0) { setImportError("Tiada rekod agent dijumpai bermula dari Row 11. Sila semak fail Excel anda."); setRawRows(null); return; }
        setRawRows(rows); setPage("dashboard");
      } catch (err) { setImportError(err.message || "Ralat membaca fail Excel. Sila pastikan format fail adalah .xlsx atau .xls yang sah."); setRawRows(null); }
    };
    reader.readAsArrayBuffer(file);
  }, []);

  const handleDrivePicked = useCallback(async ({ id, name, mimeType }) => {
    setImportError(""); setFileName(name);
    try {
      const buf = await gDrive.fetchFileArrayBuffer(id, mimeType);
      const rows = parseWorkbookToRows(new Uint8Array(buf));
      const test = extractRawRecords(rows);
      if (test.length === 0) { setImportError(`Tiada rekod agent dijumpai bermula dari Row 11. Pastikan fail Drive ini mempunyai worksheet bernama "${SHEET_NAME}" tepat seperti fail asal.`); return; }
      setRawRows(rows);
      setDriveFile({ id, name, mimeType });
      setDriveUpdateAvailable(false);
      try { const meta = await gDrive.fetchFileMeta(id); setDriveModified(meta.modifiedTime); } catch {}
      setPage("dashboard");
    } catch (err) { setImportError(err.message || "Gagal mengimport fail daripada Google Drive."); }
  }, [gDrive]);

  const refreshFromDrive = useCallback(async () => {
    if (!driveFile) return;
    try {
      const buf = await gDrive.fetchFileArrayBuffer(driveFile.id, driveFile.mimeType);
      const rows = parseWorkbookToRows(new Uint8Array(buf));
      setRawRows(rows);
      setDriveUpdateAvailable(false);
      const meta = await gDrive.fetchFileMeta(driveFile.id);
      setDriveModified(meta.modifiedTime);
    } catch (err) { setImportError(err.message || "Gagal refresh fail daripada Google Drive."); }
  }, [driveFile, gDrive]);

  useEffect(() => {
    if (!driveFile || !gDrive.token) return;
    const interval = setInterval(async () => {
      try {
        const meta = await gDrive.fetchFileMeta(driveFile.id);
        if (driveModified && meta.modifiedTime !== driveModified) setDriveUpdateAvailable(true);
      } catch {}
    }, 3 * 60 * 1000);
    return () => clearInterval(interval);
  }, [driveFile, driveModified, gDrive]);

  const records = useMemo(() => (rawRows ? extractRawRecords(rawRows) : []), [rawRows]);
  const agents = useMemo(() => (records.length ? computeAgents(records, settings) : []), [records, settings]);
  const dataQuality = useMemo(() => (records.length ? computeDataQuality(records) : null), [records]);
  const hasActiveFilter = Boolean(filters.group || filters.status || filters.activityStatus || filters.salesLevel || filters.priorityLevel || filters.creditLevel || filters.stateOfficer || search);
  const filteredAgents = useMemo(() => applyFilters(agents, filters, search), [agents, filters, search]);
  const groupStats = useMemo(() => computeGroupStats(filteredAgents), [filteredAgents]);
  const updateFollowUp = useCallback((key, val) => setFollowUps((f) => ({ ...f, [key]: val })), []);

  if (!rawRows) {
    return <div className="min-h-screen bg-slate-50 font-sans text-slate-900"><ImportPage onFile={handleFile} error={importError} fileName={fileName} gDrive={gDrive} onDrivePicked={handleDrivePicked} /></div>;
  }
  return (
    <div className="min-h-screen bg-slate-50 font-sans text-slate-900 flex">
      <Sidebar page={page} setPage={setPage} onReimport={() => { setRawRows(null); setDriveFile(null); }} agentCount={agents.length} onExport={() => downloadExcel(filteredAgents, followUps, agents.some((a) => a.stateOfficer))} driveFile={driveFile} onRefreshDrive={refreshFromDrive} />
      <MobileMenu open={mobileMenuOpen} onClose={() => setMobileMenuOpen(false)} page={page} setPage={setPage} onReimport={() => { setRawRows(null); setDriveFile(null); }} />
      <div className="flex-1 min-w-0 pb-16 lg:pb-0">
        <TopBar setMobileMenuOpen={setMobileMenuOpen} page={page} />
        <div className="p-4 sm:p-6 max-w-6xl mx-auto">
          {driveUpdateAvailable && (
            <div className="mb-4 text-sm text-blue-800 bg-blue-50 border border-blue-200 rounded-lg p-3 flex items-center justify-between gap-3">
              <span>Fail <span className="font-medium">{driveFile?.name}</span> di Google Drive telah dikemaskini.</span>
              <button onClick={refreshFromDrive} className="shrink-0 text-xs font-medium px-3 py-1.5 rounded-md bg-blue-600 text-white hover:bg-blue-700">Refresh Sekarang</button>
            </div>
          )}
          {page !== "settings" && page !== "quality" && (
            <React.Fragment>
              <FilterBar agents={agents} filters={filters} setFilters={setFilters} search={search} setSearch={setSearch} />
              {hasActiveFilter && <div className="text-xs text-slate-500 mb-4 -mt-2">Menunjukkan <span className="font-medium text-slate-700">{filteredAgents.length}</span> daripada {agents.length} agent (ditapis).</div>}
            </React.Fragment>
          )}
          {page === "dashboard" && <DashboardPage agents={filteredAgents} groupStats={groupStats} onOpenAgent={setSelectedAgent} dataQuality={dataQuality} />}
          {page === "action" && <ActionCenterPage agents={filteredAgents} onOpenAgent={setSelectedAgent} />}
          {page === "agents" && <AgentsPage agents={filteredAgents} onOpenAgent={setSelectedAgent} sortKey={sortKey} setSortKey={setSortKey} sortDir={sortDir} setSortDir={setSortDir} />}
          {page === "reload" && <ReloadOpportunitiesPage agents={filteredAgents} onOpenAgent={setSelectedAgent} />}
          {page === "reactivation" && <ReactivationPage agents={filteredAgents} onOpenAgent={setSelectedAgent} />}
          {page === "groups" && <GroupPerformancePage groupStats={groupStats} />}
          {page === "insights" && <InsightsPage agents={filteredAgents} groupStats={groupStats} />}
          {page === "quality" && <DataQualityPage dataQuality={dataQuality} />}
          {page === "settings" && <SettingsPage settings={settings} setSettings={setSettings} agents={filteredAgents} followUps={followUps} gDrive={gDrive} />}
        </div>
      </div>
      <BottomNav page={page} setPage={setPage} />
      {selectedAgent && <AgentProfileModal agent={selectedAgent} onClose={() => setSelectedAgent(null)} followUp={followUps[selectedAgent.key]} onUpdateFollowUp={updateFollowUp} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
